name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/app
          mkdir www && cp index.html www/
          npx cap init "ملفاتي" com.khader.mlfati --web-dir www
          npx cap add android
          D=android/app/src/main/java/com/khader/mlfati
          mkdir -p $D
          cp MainActivity.java FMPlugin.java $D/
          npx cap sync android
      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><application android:requestLegacyExternalStorage="true"#' $M
      - name: Fix Kotlin conflict
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' }" >> android/app/build.gradle
      - name: Icon
        run: |
          if [ -f icon.png ]; then
            sudo apt-get install -y imagemagick
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; z=${d##*:}
              mkdir -p $R/mipmap-$n
              convert icon.png -resize ${z}x${z} $R/mipmap-$n/ic_launcher.png
              cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
              cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_foreground.png
            done
          fi
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mlfati-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
