<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>مدير الملفات</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--card2:#1d2646;--tx:#eef1ff;--mu:#8d97c0;--a:#7c5cff;--b:#00d4ff;--ok:#27e1a0;--bad:#ff5d73;--r:20px}
:root.l{--bg:#f3f5fc;--card:#fff;--card2:#e9edfb;--tx:#151a33;--mu:#6b7499}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:14px 16px 10px;display:flex;gap:10px;align-items:center}
header h1{font-size:20px;flex:1;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--tx);font-size:19px;display:grid;place-items:center;transition:.15s}
.ib:active{transform:scale(.88)}
main{flex:1;overflow-y:auto;padding:0 16px 100px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.view{display:none;animation:in .25s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,var(--a),var(--b));border-radius:26px;padding:20px;color:#fff;box-shadow:0 12px 30px #7c5cff55}
.hero b{font-size:15px;opacity:.9}.hero h2{font-size:30px;margin:4px 0 12px}
.bar{height:10px;border-radius:9px;background:#fff3;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .8s}
.hero small{display:block;margin-top:8px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.cat{background:var(--card);border-radius:var(--r);padding:16px 6px;text-align:center;border:0;color:var(--tx);font-size:13px;transition:.15s}
.cat:active{transform:scale(.92)}.cat span{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;margin:0 auto 8px;font-size:24px}
h3{font-size:15px;margin:16px 2px 10px;color:var(--mu)}
.sr{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;margin-bottom:10px}
.sr input{flex:1;background:none;border:0;outline:0;color:var(--tx);height:44px;font-size:15px}
.bc{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;white-space:nowrap}
.bc button{background:var(--card);border:0;color:var(--tx);padding:7px 13px;border-radius:12px;font-size:13px}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools button{flex:1;background:var(--card);border:0;color:var(--tx);border-radius:12px;padding:9px;font-size:13px}
.list.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;position:relative;transition:.12s;content-visibility:auto;contain-intrinsic-size:60px}
.it:active{transform:scale(.97)}.it.sel{outline:2px solid var(--a);background:var(--card2)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none;overflow:hidden;background:var(--card2)}
.ic img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0}.nm small{display:block;direction:ltr;text-align:right}.nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mu);font-size:12px}
.list.g .it{flex-direction:column;text-align:center;padding:14px 6px}.list.g .nm{width:100%}.list.g .ic{width:60px;height:60px}
.star{position:absolute;left:10px;top:10px;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:50px 0}.empty div{font-size:54px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -8px 30px #0004;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;display:grid;gap:2px;justify-items:center;padding:6px;border-radius:14px;transition:.2s}
nav button i{font-style:normal;font-size:21px}nav button.on{color:var(--a);background:var(--card2)}
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:18px;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:28px;box-shadow:0 10px 24px #7c5cff77;z-index:6;transition:.2s}
.fab:active{transform:scale(.88) rotate(90deg)}
#sel{position:fixed;top:0;left:0;right:0;background:var(--a);color:#fff;display:none;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;z-index:9}
#sel.on{display:flex}#sel span{flex:1;font-weight:700}#sel button{background:#fff2;color:#fff;border:0;border-radius:12px;padding:9px 11px;font-size:13px}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.sheet.on{display:flex}
.sh{background:var(--card);width:100%;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:85%;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh h4{margin-bottom:12px;font-size:17px}.sh button.o{display:block;width:100%;text-align:right;background:var(--card2);border:0;color:var(--tx);padding:14px;border-radius:14px;margin-bottom:8px;font-size:15px}
.sh input{width:100%;background:var(--card2);border:0;color:var(--tx);padding:14px;border-radius:14px;font-size:16px;margin-bottom:10px;outline:0}
.sh .row{display:flex;gap:8px}.sh .row button{flex:1;padding:13px;border:0;border-radius:14px;font-size:15px;color:#fff;background:var(--a)}.sh .row .c{background:var(--card2);color:var(--tx)}
.pv{max-width:100%;max-height:60vh;border-radius:14px;display:block;margin:0 auto 10px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card2);padding:12px;border-radius:12px;font-size:13px;max-height:50vh;overflow:auto}
.dev{background:var(--card);border-radius:26px;padding:26px 18px;text-align:center}
.av{width:90px;height:90px;border-radius:30px;margin:0 auto 12px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:40px;color:#fff;font-weight:800}
.dev a{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;text-decoration:none;direction:ltr}
.tg{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:11px 18px;border-radius:14px;z-index:50;font-size:14px;opacity:0;transition:.3s;pointer-events:none}.tg.on{opacity:1}
.set{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px;border-radius:16px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
<div id="sel"><button onclick="clr()">✕</button><span id="sc">0</span><button onclick="bulk('copy')">نسخ</button><button onclick="bulk('move')">نقل</button><button onclick="bulk('del')">حذف</button></div>
<header><h1 id="ttl">مدير الملفات</h1><button class="ib" onclick="tgv()" id="gv">▦</button><button class="ib" onclick="tgTheme()">◐</button></header>
<main id="main">
<section class="view on" id="v-home">
<div class="hero"><b>مساحة التخزين</b><h2 id="st">—</h2><div class="bar"><i id="sb"></i></div><small id="ss"></small></div>
<div class="grid" id="cats"></div>
<h3>⏱ الأحدث</h3><div id="recent"></div>
</section>
<section class="view" id="v-files">
<div class="sr"><span>🔍</span><input id="q" placeholder="ابحث في هذا المجلد..." oninput="render()"></div>
<div class="bc" id="bc"></div>
<div class="tools"><button onclick="sortSheet()">⇅ ترتيب</button><button onclick="selAll()">☑ تحديد الكل</button><button onclick="hid=!hid;render()">👁 المخفي</button></div>
<div class="list" id="list"></div>
</section>
<section class="view" id="v-fav"><h3>⭐ المفضلة</h3><div id="favs"></div></section>
<section class="view" id="v-about">
<div class="dev"><div class="av">خ</div><h2>خضر أبو صالح</h2><p style="color:var(--mu);margin-top:4px">Khader Abo Salha</p><p style="margin-top:8px">مطوّر التطبيق</p><a href="mailto:mankhader@gmail.com">mankhader@gmail.com</a></div>
<h3>الإعدادات</h3>
<div class="set"><span>الوضع الفاتح</span><button class="ib" onclick="tgTheme()">◐</button></div>
<div class="set"><span>طلب صلاحيات التخزين</span><button class="ib" onclick="perm()">🔐</button></div>
<div class="set"><span>الإصدار</span><b>1.0</b></div><div class="set"><span>تشخيص</span><b id="dg" style="font-size:12px"></b></div>
</section>
</main>
<button class="fab" id="fab" onclick="fabSheet()">＋</button>
<nav id="nav">
<button class="on" onclick="go('home',this)"><i>🏠</i>الرئيسية</button>
<button onclick="go('files',this)"><i>📁</i>الملفات</button>
<button onclick="go('fav',this)"><i>⭐</i>المفضلة</button>
<button onclick="go('about',this)"><i>👤</i>المطوّر</button>
</nav>
</div>
<div class="sheet" id="sheet" onclick="if(event.target==this)cl()"><div class="sh" id="sh"></div></div>
<div class="tg" id="tg"></div>
<input type="file" id="imp" multiple hidden>
<script>
const $=id=>document.getElementById(id);
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()),FMP=NATIVE?((CAP.Plugins&&CAP.Plugins.FM)||CAP.registerPlugin('FM')):null,FS=FMP,RT='/storage/emulated/0/';
const DIR='EXTERNAL_STORAGE';
const EXT={img:['jpg','jpeg','png','gif','webp','bmp','heic'],vid:['mp4','mkv','avi','mov','3gp','webm'],aud:['mp3','wav','ogg','m4a','aac','flac'],doc:['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','json','html','md','xml'],apk:['apk'],zip:['zip','rar','7z','tar','gz']};
const CATS=[['img','الصور','🖼','#ff7a59'],['vid','الفيديو','🎬','#7c5cff'],['aud','الصوت','🎵','#00c2ff'],['doc','المستندات','📄','#27e1a0'],['apk','التطبيقات','📦','#ffb020'],['zip','المضغوطات','🗜','#ff5d9e']];
let path='',items=[],selSet=new Set(),grid=false,hid=false,sortBy='name',favs=JSON.parse(localStorage.fav||'[]'),clip=null,catMode=null;
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const kind=i=>{if(i.type=='dir')return'dir';const e=ext(i.name);for(const k in EXT)if(EXT[k].includes(e))return k;return'file'};
const icon=k=>({dir:'📁',img:'🖼',vid:'🎬',aud:'🎵',doc:'📄',apk:'📦',zip:'🗜',file:'📃'})[k];
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const dt=t=>t?new Date(t).toLocaleDateString('ar'):'';
function toast(m){const t=$('tg');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
/* ===== IndexedDB (web fallback) ===== */
let db;const idb=()=>new Promise(r=>{if(db)return r(db);const q=indexedDB.open('fm',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'path'});q.onsuccess=()=>{db=q.result;r(db)}});
const tx=async(m,f)=>{const d=await idb();return new Promise(r=>{const s=d.transaction('f',m).objectStore('f');const q=f(s);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})};
const all=()=>tx('readonly',s=>s.getAll());
/* ===== FS adapter ===== */
const J=(a,b)=>a?a+'/'+b:b;
const FSA={
async list(p){
 if(NATIVE){const r=await FMP.list({path:p});return r.files.map(f=>({name:f.name,type:f.dir?'dir':'file',size:f.size||0,mtime:f.mtime,path:J(p,f.name),uri:'file://'+RT+J(p,f.name)}))}
 const a=await all();const seen={},out=[];
 a.forEach(f=>{if(p&&!f.path.startsWith(p+'/'))return;const rest=p?f.path.slice(p.length+1):f.path;const n=rest.split('/')[0];if(rest.includes('/')){if(!seen[n]){seen[n]=1;out.push({name:n,type:'dir',size:0,path:J(p,n)})}}else if(f.type=='dir'){if(!seen[n]){seen[n]=1;out.push({name:n,type:'dir',size:0,path:f.path})}}else out.push({name:n,type:'file',size:f.size,mtime:f.mtime,path:f.path,blob:f.blob})});return out},
async mkdir(p){NATIVE?await FMP.mkdir({path:p}):await tx('readwrite',s=>s.put({path:p,type:'dir'}))},
async del(it){if(NATIVE){await FMP.del({path:it.path})}else{const a=await all();for(const f of a)if(f.path==it.path||f.path.startsWith(it.path+'/'))await tx('readwrite',s=>s.delete(f.path))}},
async ren(it,nn){const to=J(it.path.split('/').slice(0,-1).join('/'),nn);await this.mv(it,to)},
async mv(it,to){if(NATIVE)await FMP.mv({from:it.path,to});else{const a=await all();for(const f of a)if(f.path==it.path||f.path.startsWith(it.path+'/')){await tx('readwrite',s=>s.delete(f.path));f.path=to+f.path.slice(it.path.length);await tx('readwrite',s=>s.put(f))}}},
async cp(it,to){if(NATIVE)await FMP.cp({from:it.path,to});else{const a=await all();for(const f of a)if(f.path==it.path||f.path.startsWith(it.path+'/')){const n={...f,path:to+f.path.slice(it.path.length)};await tx('readwrite',s=>s.put(n))}}},
url(it){if(NATIVE)return CAP.convertFileSrc('file://'+RT+it.path);return it.blob?URL.createObjectURL(it.blob):''}
};
async function scan(p,d,out,lim){if(d>3||out.length>lim)return;let l;try{l=await FSA.list(p)}catch(e){window._se=((e&&e.message)||e)+'';return}for(const f of l){if(f.name[0]=='.'||(d==0&&f.name=='Android'))continue;if(f.type=='dir')await scan(f.path,d+1,out,lim);else out.push(f)}}
/* ===== Navigation / render ===== */
function go(v,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('v-'+v).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');$('ttl').textContent={home:'مدير الملفات',files:'الملفات',fav:'المفضلة',about:'المطوّر'}[v];$('fab').style.display=v=='files'?'':'none';$('main').scrollTop=0;if(v=='files'&&!window._skip)open_(path);if(v=='fav')renderFav();if(v=='home')home()}
function catGo(c){window._skip=1;goTab(1);window._skip=0;open_('',c)}
function goTab(i){document.querySelectorAll('nav button')[i].click()}
async function open_(p,cat){path=p;catMode=cat||null;clr();$('q').value='';try{if(cat){const o=[];await scan('',0,o,3000);items=o.filter(f=>kind(f)==cat);if(!items.length&&window._se)toast('خطأ: '+window._se)}else items=await FSA.list(p)}catch(e){items=[];toast('خطأ: '+((e&&(e.message||e.errorMessage))||JSON.stringify(e)).slice(0,120))}render()}
function sorted(a){const f=a.slice();f.sort((x,y)=>(y.type=='dir')-(x.type=='dir')||(sortBy=='size'?y.size-x.size:sortBy=='date'?(y.mtime||0)-(x.mtime||0):sortBy=='type'?ext(x.name).localeCompare(ext(y.name)):x.name.localeCompare(y.name,'ar')));return f}
function render(){
 const q=$('q').value.toLowerCase();let a=items.filter(i=>(hid||i.name[0]!='.')&&i.name.toLowerCase().includes(q));a=sorted(a);
 const parts=path?path.split('/'):[];let h='<button onclick="open_(\'\')">🏠 الرئيسي</button>';parts.forEach((s,i)=>h+=`<button onclick="open_('${parts.slice(0,i+1).join('/').replace(/'/g,"\\'")}')">${s}</button>`);
 $('bc').innerHTML=catMode?`<button>${CATS.find(c=>c[0]==catMode)[1]}</button>`:h;
 const L=$('list');L.className='list'+(grid?' g':'');
 L.innerHTML=a.length?a.map(i=>row(i)).join(''):'<div class="empty"><div>📂</div>المجلد فارغ<br><small>اضغط ＋ لاستيراد ملفات</small></div>';
 L._a=a;
 L.querySelectorAll('.it').forEach((e,n)=>{let t,lp;const it=a[n];e.onpointerdown=()=>{lp=0;t=setTimeout(()=>{lp=1;navigator.vibrate&&navigator.vibrate(15);tog(it)},420)};e.onpointerup=e.onpointerleave=()=>clearTimeout(t);e.onclick=()=>{if(lp)return;selSet.size?tog(it):act(it)}});
 thumbs()}
function row(i){const k=kind(i),s=selSet.has(i.path)?' sel':'';return `<div class="it${s}"><div class="ic" data-p="${i.path.replace(/"/g,'&quot;')}" data-k="${k}">${icon(k)}</div><div class="nm"><b dir="auto">${i.name}</b><small>${i.type=='dir'?'مجلد':fmt(i.size)+' · '+dt(i.mtime)}</small></div>${favs.includes(i.path)?'<span class="star">⭐</span>':''}</div>`}
const tq=[];let tr=0;
function tnext(){while(tr<3&&tq.length){const[el,it]=tq.shift();tr++;(NATIVE?FMP.thumb({path:it.path}).then(r=>r.data):Promise.resolve(FSA.url(it))).then(u=>{const im=new Image();im.src=u;im.onload=()=>{el.innerHTML='';el.appendChild(im)}}).catch(()=>{}).finally(()=>{tr--;tnext()})}}
function thumbs(){if(!('IntersectionObserver'in window))return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const it=$('list')._a.find(x=>x.path==e.target.dataset.p);if(it&&e.target.dataset.k=='img'){tq.push([e.target,it]);tnext()}}),{root:$('main')});document.querySelectorAll('.ic[data-k=img]').forEach(e=>io.observe(e))}
function tog(i){selSet.has(i.path)?selSet.delete(i.path):selSet.add(i.path);$('sel').classList.toggle('on',selSet.size>0);$('sc').textContent=selSet.size+' محدد';render()}
function clr(){selSet.clear();$('sel').classList.remove('on')}
function selAll(){$('list')._a.forEach(i=>selSet.add(i.path));$('sel').classList.add('on');$('sc').textContent=selSet.size+' محدد';render()}
const tgv=()=>{grid=!grid;$('gv').textContent=grid?'☰':'▦';render()};
function tgTheme(){document.documentElement.classList.toggle('l');localStorage.th=document.documentElement.classList.contains('l')?'l':'d'}
/* ===== Home ===== */
async function home(){
 if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();const u=e.usage||0,qt=e.quota||1;$('st').textContent=fmt(u)+' مستخدم';$('sb').style.width=Math.max(2,u/qt*100)+'%';$('ss').textContent='المتاح: '+fmt(qt-u)}
 $('cats').innerHTML=CATS.map(c=>`<button class="cat" onclick="catGo('${c[0]}')"><span style="background:${c[3]}33;color:${c[3]}">${c[2]}</span>${c[1]}</button>`).join('');
 const o=[];await scan('',0,o,400);o.sort((a,b)=>(b.mtime||0)-(a.mtime||0));
 $('recent').innerHTML=o.slice(0,8).map(i=>row(i)).join('')||'<div class="empty"><div>📭</div>لا توجد ملفات بعد<br><small>اذهب إلى «الملفات» واضغط ＋</small></div>';
 document.querySelectorAll('#recent .it').forEach((e,n)=>e.onclick=()=>act(o[n]))}
function renderFav(){const f=favs.map(p=>({name:p.split('/').pop(),path:p,type:'file',size:0}));$('favs').innerHTML=f.map(row).join('')||'<div class="empty"><div>⭐</div>لا توجد مفضلة</div>';document.querySelectorAll('#favs .it').forEach((e,n)=>e.onclick=()=>actPath(f[n]))}
async function actPath(f){const p=f.path.split('/').slice(0,-1).join('/');const l=await FSA.list(p).catch(()=>[]);const it=l.find(x=>x.path==f.path);it?act(it):toast('الملف غير موجود')}
/* ===== Sheets ===== */
const sh=h=>{$('sh').innerHTML=h;$('sheet').classList.add('on')};const cl=()=>$('sheet').classList.remove('on');
function fabSheet(){sh(`<h4>إضافة</h4><button class="o" onclick="newFolder()">📁 مجلد جديد</button><button class="o" onclick="$('imp').click();cl()">⬆ استيراد ملفات</button>${clip?'<button class="o" onclick="paste()">📋 لصق ('+clip.items.length+')</button>':''}`)}
function sortSheet(){sh('<h4>ترتيب حسب</h4>'+[['name','الاسم'],['date','التاريخ'],['size','الحجم'],['type','النوع']].map(s=>`<button class="o" onclick="sortBy='${s[0]}';cl();render()">${sortBy==s[0]?'✔ ':''}${s[1]}</button>`).join(''))}
function ask(t,v,cb){sh(`<h4>${t}</h4><input id="ai" value="${v||''}" autofocus><div class="row"><button onclick="cl()" class="c">إلغاء</button><button id="ok">موافق</button></div>`);$('ok').onclick=()=>{const x=$('ai').value.trim();if(x){cl();cb(x)}}}
function newFolder(){ask('اسم المجلد','',async n=>{await FSA.mkdir(J(path,n));toast('تم إنشاء المجلد');open_(path)})}
async function act(it){
 if(it.type=='dir')return open_(it.path);
 const k=kind(it),u=FSA.url(it);
 let body='';
 if(k=='img')body=`<img class="pv" src="${u}">`;else if(k=='vid')body=`<video class="pv" src="${u}" controls playsinline></video>`;else if(k=='aud')body=`<audio src="${u}" controls style="width:100%;margin-bottom:10px"></audio>`;
 else if(['txt','json','md','csv','html','xml'].includes(ext(it.name))){try{const t=await (await fetch(u)).text();body='<pre></pre>';setTimeout(()=>document.querySelector('#sh pre').textContent=t.slice(0,20000),0)}catch(e){}}
 const fv=favs.includes(it.path);
 sh(`<h4>${it.name}</h4>${body}<p style="color:var(--mu);margin-bottom:12px;font-size:13px">${fmt(it.size)} · ${dt(it.mtime)}<br>${it.path}</p>
 <button class="o" onclick="shareIt('${it.path.replace(/'/g,"\\'")}')">📤 مشاركة</button>
 <button class="o" onclick="fav('${it.path.replace(/'/g,"\\'")}')">${fv?'☆ إزالة من المفضلة':'⭐ إضافة للمفضلة'}</button>
 <button class="o" onclick="one('ren','${it.path.replace(/'/g,"\\'")}')">✏ إعادة تسمية</button>
 <button class="o" onclick="one('copy','${it.path.replace(/'/g,"\\'")}')">⧉ نسخ</button>
 <button class="o" onclick="one('move','${it.path.replace(/'/g,"\\'")}')">✂ نقل</button>
 <button class="o" style="color:var(--bad)" onclick="one('del','${it.path.replace(/'/g,"\\'")}')">🗑 حذف</button>`)}
const find=p=>$('list')._a.find(x=>x.path==p)||items.find(x=>x.path==p);
function fav(p){favs=favs.includes(p)?favs.filter(x=>x!=p):[...favs,p];localStorage.fav=JSON.stringify(favs);cl();render();toast('تم')}
async function shareIt(p){const it=find(p);cl();try{if(NATIVE&&CAP.registerPlugin('Share'))await CAP.registerPlugin('Share').share({title:it.name,url:it.uri});else if(navigator.share&&it.blob)await navigator.share({files:[new File([it.blob],it.name)]});else toast('المشاركة غير متاحة')}catch(e){}}
function one(a,p){cl();const it=find(p);if(a=='ren')ask('الاسم الجديد',it.name,async n=>{await FSA.ren(it,n);toast('تمت التسمية');open_(path,catMode)});else if(a=='del')conf('حذف «'+it.name+'»؟',async()=>{await FSA.del(it);toast('تم الحذف');open_(path,catMode)});else{clip={m:a,items:[it]};toast('اذهب للمجلد الهدف ثم ＋ ← لصق');}}
function bulk(a){const its=[...selSet].map(find).filter(Boolean);if(a=='del')conf('حذف '+its.length+' عنصر؟',async()=>{for(const i of its)await FSA.del(i);clr();toast('تم الحذف');open_(path,catMode)});else{clip={m:a,items:its};clr();render();toast('انتقل للمجلد الهدف ثم ＋ ← لصق')}}
function conf(t,f){sh(`<h4>${t}</h4><div class="row"><button class="c" onclick="cl()">إلغاء</button><button style="background:var(--bad)" id="ok">تأكيد</button></div>`);$('ok').onclick=()=>{cl();f()}}
async function paste(){cl();for(const i of clip.items){const to=J(path,i.name);if(to==i.path||to.startsWith(i.path+'/'))continue;clip.m=='move'?await FSA.mv(i,to):await FSA.cp(i,to)}clip=null;toast('تم');open_(path)}
$('imp').onchange=async e=>{for(const f of e.target.files){if(NATIVE){const d=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});await FMP.write({path:J(path,f.name),data:d})}else await tx('readwrite',s=>s.put({path:J(path,f.name),type:'file',name:f.name,size:f.size,mtime:Date.now(),blob:f}))}toast('تم استيراد '+e.target.files.length+' ملف');e.target.value='';open_(path)};
async function perm(){try{if(NATIVE){const r=await FMP.check();if(r.granted)toast('الصلاحية ممنوحة ✔');else{toast('فعّل «الوصول إلى كل الملفات» ثم ارجع للتطبيق');await FMP.ask()}}else toast('الصلاحيات تُطلب داخل تطبيق APK')}catch(e){toast('خطأ: '+(e.message||e))}}
/* back button */
if(NATIVE)CAP.registerPlugin('App').addListener('backButton',()=>{if($('sheet').classList.contains('on'))cl();else if(selSet.size)clr();else if($('v-files').classList.contains('on')&&(path||catMode))open_(path.split('/').slice(0,-1).join('/'));else if(!$('v-home').classList.contains('on'))goTab(0);else CAP.registerPlugin('App').exitApp()});
if(localStorage.th=='l')document.documentElement.classList.add('l');
$('fab').style.display='none';$('dg').textContent='native='+NATIVE+' cap='+!!CAP+' fm='+!!FMP;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NATIVE){home();if($('v-files').classList.contains('on'))open_(path,catMode)}});
(async()=>{if(NATIVE)await perm();home()})();
</script>
</body>
</html>
